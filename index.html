<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QueryRise — What's rising. What's being searched.</title>
  <meta name="description" content="QueryRise tracks rising searches and trending topics across India and worldwide with useful context, sources and live refresh status.">
  <meta name="theme-color" content="#07111f">
  <meta property="og:title" content="QueryRise — What's rising. What's being searched.">
  <meta property="og:description" content="Discover what's rising across search, technology, sports, entertainment, jobs and more.">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://queryrise.example/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2307111f'/%3E%3Cpath d='M24 65 44 45l12 12 21-28' fill='none' stroke='%2300e5ff' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M65 29h14v14' fill='none' stroke='%238c5cff' stroke-width='10' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{--bg:#050a12;--panel:#0b1320;--panel2:#0f1b2b;--text:#f4f7fb;--muted:#91a0b5;--line:#1b2a3e;--cyan:#00e5ff;--violet:#8c5cff;--green:#31e981;--radius:20px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 75% -10%,#142a45 0,#07111f 32%,#050a12 68%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}
    a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}
    header{position:sticky;top:0;z-index:20;background:rgba(5,10,18,.82);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.06)}
    .nav{height:76px;display:flex;align-items:center;gap:26px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:21px;letter-spacing:-.6px}.mark{width:39px;height:39px;border-radius:12px;background:linear-gradient(135deg,#07111f,#101d32);border:1px solid #243b55;position:relative;box-shadow:0 0 30px rgba(0,229,255,.12)}.mark:after{content:"";position:absolute;width:17px;height:17px;border-left:4px solid var(--cyan);border-top:4px solid var(--violet);transform:rotate(45deg);left:10px;top:10px}.brand em{font-style:normal;background:linear-gradient(90deg,#00e5ff,#9a6cff);-webkit-background-clip:text;color:transparent}.navlinks{display:flex;gap:19px;margin-left:auto;color:#b9c5d5;font-size:14px}.navlinks a:hover{color:white}.status{font-size:12px;border:1px solid #1d394c;background:#091825;padding:8px 11px;border-radius:999px;color:#b9d4df}.dot{display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:6px;box-shadow:0 0 10px var(--green)}
    .hero{padding:76px 0 34px;text-align:center}.eyebrow{display:inline-flex;gap:8px;align-items:center;color:#a8b7ca;font-size:12px;text-transform:uppercase;letter-spacing:1.7px;background:rgba(255,255,255,.04);border:1px solid var(--line);padding:8px 12px;border-radius:999px}.hero h1{font-size:clamp(43px,7vw,78px);line-height:.98;letter-spacing:-4px;margin:22px auto 18px;max-width:900px}.gradient{background:linear-gradient(100deg,#fff 10%,#bcefff 44%,#8f65ff 90%);-webkit-background-clip:text;color:transparent}.hero p{max-width:680px;margin:0 auto;color:var(--muted);font-size:17px}
    .search{max-width:720px;margin:28px auto 0;display:flex;gap:10px;background:#0b1523;border:1px solid #263b52;padding:8px;border-radius:18px;box-shadow:0 15px 60px rgba(0,0,0,.25)}.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:white;font-size:16px;padding:12px}.search button{border:0;color:#031018;background:linear-gradient(135deg,#00e5ff,#9a6cff);font-weight:800;padding:12px 19px;border-radius:12px;cursor:pointer}
    .timerbar{margin:26px auto 0;display:flex;justify-content:center;gap:18px;align-items:center;color:#9eacc0;font-size:13px}.timer{color:white;font-weight:750;font-variant-numeric:tabular-nums}.refresh{border:0;background:none;color:#72ddff;cursor:pointer}
    main{padding:20px 0 70px}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:30px 0 16px}.sectionhead h2{margin:0;font-size:25px;letter-spacing:-.7px}.sectionhead p{margin:0;color:var(--muted);font-size:13px}
    .chips{display:flex;gap:9px;overflow:auto;padding:2px 0 12px}.chip{white-space:nowrap;padding:9px 13px;border:1px solid var(--line);background:#09121e;color:#aebbd0;border-radius:999px;font-size:13px;cursor:pointer}.chip.active,.chip:hover{background:#122338;color:#e9faff;border-color:#2a5871}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:linear-gradient(145deg,rgba(17,30,48,.95),rgba(8,15,25,.96));border:1px solid #1c2d43;border-radius:var(--radius);padding:20px;min-height:220px;position:relative;overflow:hidden;transition:.2s transform,.2s border-color}.card:hover{transform:translateY(-3px);border-color:#31536f}.card:before{content:"";position:absolute;width:150px;height:150px;right:-80px;top:-80px;background:rgba(0,229,255,.08);filter:blur(25px);border-radius:50%}.meta{display:flex;justify-content:space-between;gap:10px;color:#8798ad;font-size:12px}.rise{color:#42ed99;background:rgba(49,233,129,.09);border:1px solid rgba(49,233,129,.15);padding:5px 8px;border-radius:8px;font-weight:700}.card h3{font-size:21px;line-height:1.15;margin:18px 0 10px;letter-spacing:-.4px}.card p{color:#95a5ba;font-size:14px;margin:0 0 20px}.cardfoot{display:flex;justify-content:space-between;align-items:center;color:#71849c;font-size:12px}.read{color:#aeefff;font-weight:700}
    .feature{display:grid;grid-template-columns:1.35fr .65fr;gap:14px}.feature .card:first-child{min-height:300px;padding:27px}.feature .card:first-child h3{font-size:32px;max-width:650px}.rank{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}.rank:last-child{border:0}.num{font-size:12px;color:#60748d;width:20px}.spark{margin-left:auto;color:#38eb96;font-size:12px}
    .ad{height:96px;border:1px dashed #26374b;border-radius:16px;display:grid;place-items:center;color:#52657c;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;margin:28px 0}
    footer{border-top:1px solid var(--line);padding:35px 0 50px;color:#718096;font-size:13px}.footergrid{display:flex;justify-content:space-between;gap:30px}.footerlinks{display:flex;gap:17px;flex-wrap:wrap}
    .page{padding:50px 0}.article{max-width:820px;margin:auto}.article h1{font-size:clamp(38px,6vw,64px);line-height:1.02;letter-spacing:-2.5px}.article .lead{font-size:18px;color:#aebbd0}.article section{margin:32px 0}.article h2{font-size:25px}.article p,.article li{color:#9baabd}.back{color:#70dcff;font-size:14px}
    @media(max-width:850px){.navlinks{display:none}.grid{grid-template-columns:1fr 1fr}.feature{grid-template-columns:1fr}.hero{padding-top:55px}.hero h1{letter-spacing:-2.5px}.status{display:none}}
    @media(max-width:560px){.wrap{width:min(100% - 22px,1180px)}.grid{grid-template-columns:1fr}.search button{padding:11px 13px}.search input{font-size:14px}.timerbar{flex-wrap:wrap}.footergrid{flex-direction:column}.hero p{font-size:15px}}
  </style>
</head>
<body>
<header><div class="wrap nav">
  <a class="brand" href="#/"><span class="mark"></span><span>Query<em>Rise</em></span></a>
  <nav class="navlinks"><a href="#/">Trending</a><a href="#/category/india">India</a><a href="#/category/ai-tech">AI & Tech</a><a href="#/category/sports">Sports</a><a href="#/category/entertainment">Entertainment</a><a href="#/about">About</a></nav>
  <div class="status"><span class="dot"></span>Live data system</div>
</div></header>
<div id="app"></div>
<footer><div class="wrap footergrid"><div><strong style="color:#dce6f2">QueryRise</strong><br>What’s rising. What’s being searched.</div><div class="footerlinks"><a href="#/about">About</a><a href="#/contact">Contact</a><a href="#/privacy">Privacy</a><a href="#/terms">Terms</a><a href="#/disclaimer">Disclaimer</a><a href="#/editorial">Editorial Policy</a></div></div></footer>
<script>
const categories=["All","India","Worldwide","AI & Tech","Sports","Entertainment","Technology","Jobs & Exams","Viral"];
let trends=[
["Real Madrid vs Inter","Sports","200K+","1,000%","A major football search surge is drawing attention as fans follow the latest match developments, line-ups and results.","6h ago"],
["iPhone 18","Technology","100K+","200%","Search interest is rising around the next iPhone generation, expected launch timing, specifications and pricing discussions.","15h ago"],
["Bangladesh vs UAE","Sports","100K+","1,000%","The cricket fixture is attracting a sharp wave of searches for scores, squads, standings and match updates.","17h ago"],
["8th Pay Commission News","India","50K+","1,000%","People are searching for the latest developments and explanations around the 8th Pay Commission and government pay changes.","15h ago"],
["AI Agents","AI & Tech","50K+","650%","AI agent systems are gaining attention as developers and businesses explore software that can plan and execute multi-step tasks.","2h ago"],
["Vivo X500 Series","Technology","10K+","700%","Interest is building around Vivo's next flagship line, especially expected specifications, cameras and launch information.","10h ago"],
["NEET PG Answer Key","Jobs & Exams","10K+","500%","Students are searching for answer-key updates, expected timelines and what the results could mean for counselling.","3h ago"],
["1980s Photo Prompt","Viral","5K+","400%","A nostalgic AI-image trend is spreading as users experiment with prompts designed to recreate an authentic 1980s visual style.","4h ago"],
["ChatGPT GPT Astra","AI & Tech","20K+","300%","Searches are rising around new AI capabilities, naming rumours and what users can actually access.","5h ago"]
];
let lastUpdate=Date.now();
function esc(s){return String(s).replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]))}
function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function timer(){let count=document.querySelector("#count"),last=document.querySelector("#last");if(!count)return;let tick=()=>{let diff=Math.max(0,30*60*1000-(Date.now()-lastUpdate));count.textContent=`${String(Math.floor(diff/60000)).padStart(2,"0")}:${String(Math.floor(diff/1000)%60).padStart(2,"0")}`;let mins=Math.floor((Date.now()-lastUpdate)/60000);last.textContent=mins?`Updated ${mins} min ago`:"Updated just now"};tick();clearInterval(window.__timer);window.__timer=setInterval(tick,1000)}
async function refreshData(){try{let r=await fetch("/api/trends",{cache:"no-store"});if(r.ok){let d=await r.json();if(Array.isArray(d.trends)&&d.trends.length){trends=d.trends.map(x=>[x.title||"Untitled",x.category||"Worldwide",x.volume||"—",x.growth||"rising",x.summary||"A currently rising search topic.",x.age||"fresh"]);lastUpdate=Date.now();render();}}}catch(e){console.warn("QueryRise refresh failed",e)}}
function shell(content){return `<div class="wrap">${content}</div>`}
function card(t){return `<article class="card"><div class="meta"><span>${esc(t[1])}</span><span class="rise">↑ ${esc(t[3])}</span></div><h3>${esc(t[0])}</h3><p>${esc(t[4])}</p><div class="cardfoot"><span>${esc(t[2])} searches · ${esc(t[5])}</span><a class="read" href="#/trend/${slugify(t[0])}">Explore →</a></div></article>`}
function home(){let q=new URLSearchParams(location.hash.split("?")[1]||"").get("q")||"";let list=trends.filter(t=>!q||t.join(" ").toLowerCase().includes(q.toLowerCase()));return shell(`<section class="hero"><span class="eyebrow">✦ Search intelligence, simplified</span><h1>See what’s <span class="gradient">rising</span> before everyone else.</h1><p>QueryRise turns search momentum into useful, readable context — across India, the world, technology, sports, entertainment and more.</p><form class="search" onsubmit="event.preventDefault();location.hash='#/?q='+encodeURIComponent(this.q.value)"><input name="q" value="${esc(q)}" placeholder="Search a topic, trend or keyword…"><button>Search</button></form><div class="timerbar"><span>Next data refresh <strong class="timer" id="count">30:00</strong></span><span id="last">Updated just now</span><button class="refresh" onclick="refreshData()">↻ Refresh now</button></div></section><main><div class="sectionhead"><div><h2>Trending Now</h2><p>Fresh snapshots, refreshed automatically every 30 minutes.</p></div></div><div class="chips">${categories.map(c=>`<button class="chip ${c==="All"?"active":""}" onclick="${c==="All"?"location.hash='#/'":"location.hash='#/category/"+slugify(c)+"'"}">${c}</button>`).join("")}</div><div class="feature"><article class="card"><div class="meta"><span>TOP SURGE · ${esc(trends[0][1])}</span><span class="rise">↑ ${esc(trends[0][3])}</span></div><h3>${esc(trends[0][0])}</h3><p>${esc(trends[0][4])}</p><div class="cardfoot"><span>${esc(trends[0][2])} searches</span><a class="read" href="#/trend/${slugify(trends[0][0])}">Read full trend →</a></div></article><article class="card"><div class="meta"><span>RISING RIGHT NOW</span></div>${trends.slice(0,5).map((t,i)=>`<div class="rank"><span class="num">0${i+1}</span><strong>${esc(t[0])}</strong><span class="spark">↑ ${esc(t[3])}</span></div>`).join("")}</article></div><div class="ad">Advertisement · future AdSense placement</div><div class="grid">${list.slice(0,9).map(card).join("")}</div></main>`)}
function category(slug){let name=slug.replace(/-/g," ").replace(/\b\w/g,x=>x.toUpperCase());if(slug==="ai-tech")name="AI & Tech";let list=trends.filter(t=>slugify(t[1])===slug);if(!list.length)list=trends;return shell(`<div class="page"><a class="back" href="#/">← Back to Trending Now</a><div class="sectionhead"><div><h1 style="font-size:45px;margin:20px 0 4px">${esc(name)}</h1><p>Current search momentum and useful context.</p></div></div><div class="grid">${list.map(card).join("")}</div></div>`)}
function article(slug){let t=trends.find(x=>slugify(x[0])===slug)||trends[0];return shell(`<div class="page article"><a class="back" href="#/">← Back to QueryRise</a><div style="margin-top:20px"><span class="eyebrow">${esc(t[1])} · ↑ ${esc(t[3])}</span><h1>${esc(t[0])}</h1><p class="lead">${esc(t[4])}</p><p style="color:#718198;font-size:13px">Published/updated ${esc(t[5])} · Search volume ${esc(t[2])}</p></div><div class="ad">Advertisement · future AdSense placement</div><section><h2>Why is this trending?</h2><p>Search interest can rise quickly when a topic connects to a live event, announcement, product cycle, public result or widely shared story. QueryRise groups the search signal with readable context so visitors can understand what people are looking for rather than seeing a list of keywords.</p></section><section><h2>What people are searching for</h2><p>Related searches typically include updates, results, dates, prices, explanations and the names of people or organisations connected to the topic. These related queries are monitored as part of the trend snapshot and may change on the next refresh.</p></section><section><h2>Latest context</h2><p>This page is designed to separate the search signal from the explanation. For a production data connection, the latest source material should be checked before publication and the page timestamp should update with the verified snapshot.</p></section><section><h2>Frequently asked questions</h2><h3>How often does QueryRise refresh?</h3><p>The dashboard refreshes every 30 minutes, with a live countdown. The underlying Google Trends Trending Now service can refresh more frequently; QueryRise uses its own scheduled snapshot cadence.</p><h3>Is QueryRise affiliated with Google?</h3><p>No. QueryRise is an independent trends-information website.</p></section><section><h2>Sources</h2><p>Primary trend signal: Google Trends Trending Now. Additional sources should be listed here when used for the article's factual context.</p></section></div>`)}
function legal(title,text){return shell(`<div class="page article"><a class="back" href="#/">← Back to QueryRise</a><h1>${title}</h1><p class="lead">${text}</p><section><h2>Our approach</h2><p>QueryRise is designed to provide useful original explanations around search trends. Trend signals are not presented as endorsements, predictions or guarantees. Information can change quickly, so readers should verify important details with primary sources.</p></section></div>`)}
function render(){let h=location.hash.slice(1)||"/";let path=h.split("?")[0];let out=path==="/"||path===""?home():path.startsWith("/category/")?category(path.slice(10)):path.startsWith("/trend/")?article(path.slice(7)):path==="/about"?legal("About QueryRise","QueryRise is an independent search-trends information project focused on explaining what is rising and why it matters."):path==="/contact"?legal("Contact","For editorial corrections, source questions or partnership enquiries, use the contact address configured by the site owner."):path==="/privacy"?legal("Privacy Policy","This page should be replaced with the site's final privacy notice before AdSense application and launch."):path==="/terms"?legal("Terms of Use","Use of QueryRise is subject to the final published terms of use."):path==="/disclaimer"?legal("Disclaimer","Trend data and news context can change rapidly. Always verify important decisions against authoritative primary sources."):legal("Editorial & Source Policy","QueryRise aims to use original summaries, clear timestamps and identifiable sources rather than thin keyword pages.");document.querySelector("#app").innerHTML=out;timer()}
addEventListener("hashchange",render);render();setTimeout(refreshData,500);
</script>
</body></html>
